name: Build and deploy Inkverelle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure the Pages base path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [[ "$repo_name" == "$owner.github.io" ]]; then
            echo "SITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${owner}.github.io/${repo_name}" >> "$GITHUB_ENV"
          fi
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
